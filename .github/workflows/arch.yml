name: Build Arch Package

on:
  push:
    tags:
      - '*'

env:
  GITEA_INSTANCE_URL: ${{ secrets.GITEA_INSTANCE_URL }}
  GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
  GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
  GITEA_OWNER: ${{ secrets.GITEA_OWNER }}
  GITEA_REPO: ${{ secrets.GITEA_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git rustup namcap

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package
        run: |
          su builder -c "
            cd archlinux
            rustup default stable
            makepkg -s --noconfirm --cleanbuild --nocheck --log
          "

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: archlinux/*.pkg.tar.zst
          retention-days: 21

      - name: Publish to Gitea
        run: |
          set -e

          PACKAGE_FILE="$(ls archlinux/*.pkg.tar.zst | head -n1)"

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "Error: No .pkg.tar.zst found in archlinux/ directory."
            exit 1
          fi
          curl --fail \
               --user "${GITEA_USERNAME}:${GITEA_TOKEN}" \
               --upload-file "$PACKAGE_FILE" \
               "${GITEA_INSTANCE_URL}/api/packages/${GITEA_OWNER}/arch/${GITEA_REPO}"

        # uncomment the next line if you wanna see output when curl fails
        # shell: bash -l {0}
